name: apple

on:
  pull_request:
    paths:
      - "apps/apple/**"
      - "packages/**"
      - "contracts/**"
      - "fixtures/**"
      - "tools/**"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    # A release tag runs the full e2e suite. Path filters do not apply to tags.
    tags: ["v*"]
    paths:
      - "apps/apple/**"
      - "packages/**"
      - "contracts/**"
      - "fixtures/**"
      - "tools/**"
      - ".github/workflows/apple.yml"
  # One nightly run, 18:00 UTC. It runs the full suite on the iOS simulator.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

# A newer push on the same branch supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: swift-format lint
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --recursive apps packages tools
          else
            echo "swift-format not installed on this runner; skipping."
          fi
      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            git ls-files '*.sh' | xargs -r shellcheck
          else
            echo "shellcheck not installed on this runner; skipping."
          fi
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: privacy manifest
        run: |
          MANIFEST=apps/apple/Resources/PrivacyInfo.xcprivacy
          if [ ! -f "$MANIFEST" ]; then
            echo "$MANIFEST not present yet; skipping."
            exit 0
          fi
          if command -v plutil >/dev/null 2>&1; then
            plutil -lint "$MANIFEST"
          else
            python3 -c "import plistlib,sys; plistlib.load(open('$MANIFEST','rb')); print('plist OK')"
          fi

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: validate contracts and fixtures
        run: |
          pip install jsonschema
          python3 tools/contracts/validate.py

  unit:
    name: unit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: swift version
        id: swift
        run: echo "version=$(swift --version | head -1 | tr -cs 'A-Za-z0-9.-' '-')" >> "$GITHUB_OUTPUT"
      - name: cache SwiftPM and package builds
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            packages/*/.build
          key: swiftpm-tests-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('packages/*/Package.resolved', 'packages/*/Package.swift') }}
          restore-keys: |
            swiftpm-tests-${{ runner.os }}-${{ steps.swift.outputs.version }}-
      - name: swift test, every package, warnings as errors
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/Package.swift" ]; then
              swift test --package-path "$pkg" -Xswiftc -warnings-as-errors
            fi
          done

  build-macos:
    name: build-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: install xcodegen
        run: brew install xcodegen
      - name: xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: stub Device.xcconfig for xcodegen
        working-directory: apps/apple
        run: |
          # The team id lives in a gitignored file. CI never signs, so the
          # example placeholder satisfies the generator without a secret.
          if [ ! -f Config/Device.xcconfig ]; then
            cp Config/Device.xcconfig.example Config/Device.xcconfig
          fi
      - name: cache Debug build intermediates
        uses: actions/cache@v4
        with:
          path: |
            apps/apple/build/macos/Build/Intermediates.noindex
            apps/apple/build/macos/SourcePackages
          key: xcode-debug-macos-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/apple/project.yml', 'packages/*/Package.resolved') }}
          restore-keys: |
            xcode-debug-macos-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
      - name: unsigned macOS build
        working-directory: apps/apple
        run: |
          xcodegen generate
          # The hosted runner is arm64. Build its active slice, not a
          # universal app that also carries an x86_64 slice nobody runs.
          xcodebuild -project ReadLater.xcodeproj -scheme ReadLater \
            -destination 'platform=macOS' -derivedDataPath build/macos \
            build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

  build-ios:
    name: build-ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: install xcodegen
        run: brew install xcodegen
      - name: xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: stub Device.xcconfig for xcodegen
        working-directory: apps/apple
        run: |
          # The team id lives in a gitignored file. CI never signs, so the
          # example placeholder satisfies the generator without a secret.
          if [ ! -f Config/Device.xcconfig ]; then
            cp Config/Device.xcconfig.example Config/Device.xcconfig
          fi
      - name: cache Debug build intermediates
        uses: actions/cache@v4
        with:
          path: |
            apps/apple/build/ios/Build/Intermediates.noindex
            apps/apple/build/ios/SourcePackages
          key: xcode-debug-ios-simulator-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/apple/project.yml', 'packages/*/Package.resolved') }}
          restore-keys: |
            xcode-debug-ios-simulator-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
      - name: unsigned simulator build
        working-directory: apps/apple
        run: |
          xcodegen generate
          # The runner is arm64. Pin the simulator build to one arm64 slice so
          # it does not also compile x86_64.
          xcodebuild -project ReadLater.xcodeproj -scheme ReadLater \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios build CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO

  # There is no separate invariant job. `swift test --filter Invariant`
  # matched no Swift Testing names, so it only repeated the `unit` build.
  # `unit` runs the invariant tests in every package already.

  # Core holds the three journeys that prove the product loop. It runs on a pull
  # request and on a push to main. A failure is a failure: no retries.
  e2e-core:
    name: e2e-core (${{ matrix.platform }})
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            destination: "platform=macOS"
    env:
      SUITE: core
      MIN_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: stub Device.xcconfig for xcodegen
        working-directory: apps/apple
        run: |
          # The team id lives in a gitignored file. CI never signs, so the
          # example placeholder satisfies the generator without a secret.
          if [ ! -f Config/Device.xcconfig ]; then
            cp Config/Device.xcconfig.example Config/Device.xcconfig
          fi
      - name: install xcodegen
        run: brew install xcodegen
      - name: generate project
        working-directory: apps/apple
        run: xcodegen generate
      - name: build for testing
        working-directory: apps/apple
        run: |
          xcodebuild build-for-testing \
            -project ReadLater.xcodeproj -scheme ReadLater \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build/e2e \
            -only-testing:ReadLaterE2ETests \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: run core journeys
        working-directory: apps/apple
        run: |
          # One class per feature. A class that has not landed yet is left out,
          # so the count guard reports a short suite instead of a bad
          # identifier. The guard, not this list, decides pass or fail.
          ONLY=()
          for cls in EntryTests; do
            if [ -f "E2ETests/$cls.swift" ]; then
              ONLY+=("-only-testing:ReadLaterE2ETests/$cls")
            fi
          done
          printf 'selecting:%s\n' "${ONLY[*]:-none}"
          rm -rf "artifacts/e2e-${{ matrix.platform }}.xcresult"
          mkdir -p artifacts
          xcodebuild test-without-building \
            -project ReadLater.xcodeproj -scheme ReadLater \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build/e2e \
            -resultBundlePath "artifacts/e2e-${{ matrix.platform }}.xcresult" \
            "${ONLY[@]}" \
            CODE_SIGNING_ALLOWED=NO
      - name: count guard and summary
        # Always: a failed run still needs its table and its named Scenario.
        if: always()
        working-directory: apps/apple
        run: |
          BUNDLE="artifacts/e2e-${{ matrix.platform }}.xcresult"
          SUMMARY=$(mktemp)
          TESTS=$(mktemp)
          xcrun xcresulttool get test-results summary --path "$BUNDLE" --format json > "$SUMMARY"
          xcrun xcresulttool get test-results tests --path "$BUNDLE" --format json > "$TESTS"
          TOTAL=$(jq -r '.totalTestCount // 0' "$SUMMARY")
          PASSED=$(jq -r '.passedTests // 0' "$SUMMARY")
          FAILED=$(jq -r '.failedTests // 0' "$SUMMARY")
          SKIPPED=$(jq -r '.skippedTests // 0' "$SUMMARY")
          SECS=$(jq -r '((.finishTime // 0) - (.startTime // 0)) | floor' "$SUMMARY")
          TIME=$(printf '%dm%02ds' $((SECS / 60)) $((SECS % 60)))
          SCENARIO=$(jq -r '[.. | objects
            | select(.nodeType? == "Test Case" and .result? != "Passed")
            | .name] | first // "—"' "$TESTS")
          {
            echo "### e2e-$SUITE · ${{ matrix.platform }}"
            echo
            echo "| Platform | Suite | Passed | Failed | Skipped | Time | Failed Scenario |"
            echo "|----------|-------|--------|--------|---------|------|-----------------|"
            echo "| ${{ matrix.platform }} | $SUITE | $PASSED | $FAILED | $SKIPPED | $TIME | $SCENARIO |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED of $TOTAL tests failed: $SCENARIO"
            exit 1
          fi
          if [ "$TOTAL" -lt "$MIN_TESTS" ]; then
            echo "::error::only $TOTAL tests ran; $MIN_TESTS required"
            exit 1
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::error::$SKIPPED tests skipped; no journey may skip"
            exit 1
          fi
      - name: export screenshots and failure context
        if: failure()
        working-directory: apps/apple
        run: |
          BUNDLE="artifacts/e2e-${{ matrix.platform }}.xcresult"
          [ -d "$BUNDLE" ] || exit 0
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path "$BUNDLE" --output-path screenshots || true
      - name: upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}
          path: |
            apps/apple/artifacts/e2e-${{ matrix.platform }}.xcresult
            apps/apple/screenshots
          if-no-files-found: ignore
          retention-days: 14

  # Full runs every journey. Nightly, on demand, and on a release tag.
  # Artefacts upload on every run so a green night is readable.
  # macOS is absent: its UI runner needs Automation permission that a hosted
  # runner cannot grant. The same suite runs on a Mac with that permission;
  # see the research spec. Add the job back with a self-hosted label.
  e2e-full:
    name: e2e-full (${{ matrix.platform }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            destination: "platform=iOS Simulator,name=iPhone 16"
    env:
      SUITE: full
      MIN_TESTS: "3"
    steps:
      - uses: actions/checkout@v5
      - name: stub Device.xcconfig for xcodegen
        working-directory: apps/apple
        run: |
          if [ ! -f Config/Device.xcconfig ]; then
            cp Config/Device.xcconfig.example Config/Device.xcconfig
          fi
      - name: install xcodegen
        run: brew install xcodegen
      - name: generate project
        working-directory: apps/apple
        run: xcodegen generate
      - name: build for testing
        working-directory: apps/apple
        run: |
          xcodebuild build-for-testing \
            -project ReadLater.xcodeproj -scheme ReadLater \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build/e2e \
            -only-testing:ReadLaterE2ETests \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: start simulator video
        working-directory: apps/apple
        run: |
          # iOS simulator screen recording for e2e-full only. A recorder
          # failure must never fail the tests, so every line tolerates one.
          mkdir -p artifacts || true
          xcrun simctl boot "iPhone 16" >/dev/null 2>&1 || true
          UDID=$(xcrun simctl list devices booted -j 2>/dev/null | jq -r '[.. | objects | select(.state? == "Booted") | .udid] | first // empty' || true)
          if [ -z "$UDID" ]; then
            echo "no booted simulator; skipping video"
            exit 0
          fi
          (xcrun simctl io "$UDID" recordVideo --codec=h264 "artifacts/e2e-${{ matrix.platform }}.mp4" || true) &
          echo $! > artifacts/video.pid || true
          echo "recording on $UDID (pid $(cat artifacts/video.pid 2>/dev/null || echo unknown))"
      - name: run every journey
        working-directory: apps/apple
        run: |
          rm -rf "artifacts/e2e-${{ matrix.platform }}.xcresult"
          mkdir -p artifacts
          xcodebuild test-without-building \
            -project ReadLater.xcodeproj -scheme ReadLater \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build/e2e \
            -resultBundlePath "artifacts/e2e-${{ matrix.platform }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: stop simulator video
        if: always()
        working-directory: apps/apple
        run: |
          if [ -f artifacts/video.pid ]; then
            kill -INT "$(cat artifacts/video.pid)" 2>/dev/null || true
            sleep 2 || true
          fi
          ls -la artifacts/*.mp4 2>/dev/null || echo "no video recorded"
      - name: count guard and summary
        # Always: a bad night still needs its table and its named Scenario.
        if: always()
        working-directory: apps/apple
        run: |
          BUNDLE="artifacts/e2e-${{ matrix.platform }}.xcresult"
          SUMMARY=$(mktemp)
          TESTS=$(mktemp)
          xcrun xcresulttool get test-results summary --path "$BUNDLE" --format json > "$SUMMARY"
          xcrun xcresulttool get test-results tests --path "$BUNDLE" --format json > "$TESTS"
          TOTAL=$(jq -r '.totalTestCount // 0' "$SUMMARY")
          PASSED=$(jq -r '.passedTests // 0' "$SUMMARY")
          FAILED=$(jq -r '.failedTests // 0' "$SUMMARY")
          SKIPPED=$(jq -r '.skippedTests // 0' "$SUMMARY")
          SECS=$(jq -r '((.finishTime // 0) - (.startTime // 0)) | floor' "$SUMMARY")
          TIME=$(printf '%dm%02ds' $((SECS / 60)) $((SECS % 60)))
          SCENARIO=$(jq -r '[.. | objects
            | select(.nodeType? == "Test Case" and .result? != "Passed")
            | .name] | first // "—"' "$TESTS")
          {
            echo "### e2e-$SUITE · ${{ matrix.platform }}"
            echo
            echo "| Platform | Suite | Passed | Failed | Skipped | Time | Failed Scenario |"
            echo "|----------|-------|--------|--------|---------|------|-----------------|"
            echo "| ${{ matrix.platform }} | $SUITE | $PASSED | $FAILED | $SKIPPED | $TIME | $SCENARIO |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED of $TOTAL tests failed: $SCENARIO"
            exit 1
          fi
          if [ "$TOTAL" -lt "$MIN_TESTS" ]; then
            echo "::error::only $TOTAL tests ran; $MIN_TESTS required"
            exit 1
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::error::$SKIPPED tests skipped; no journey may skip"
            exit 1
          fi
      - name: export screenshots and failure context
        if: always()
        working-directory: apps/apple
        run: |
          BUNDLE="artifacts/e2e-${{ matrix.platform }}.xcresult"
          [ -d "$BUNDLE" ] || exit 0
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path "$BUNDLE" --output-path screenshots || true
      - name: upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}
          path: |
            apps/apple/artifacts/e2e-${{ matrix.platform }}.xcresult
            apps/apple/screenshots
          if-no-files-found: ignore
          retention-days: 30
      - name: upload simulator video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}-video
          path: apps/apple/artifacts/e2e-${{ matrix.platform }}.mp4
          if-no-files-found: ignore
          retention-days: 7

  # The debug surface is DEBUG-only. A Release binary that still holds the
  # flag prefix ships a back door, so the literal must be absent.
  #
  # The guard inspects the device slice, which is the one that ships, not a
  # simulator slice that never does. A generic iOS build produces that arm64
  # slice only, so the simulator's x86_64 slice is never compiled.
  # `DEBUG_INFORMATION_FORMAT=dwarf` and `COMPILER_INDEX_STORE_ENABLE=NO` skip
  # dSYM and index-store work. Neither changes the `#if DEBUG` condition, so
  # the build still proves the debug surface is compiled out.
  release-guard:
    name: release-guard
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: stub Device.xcconfig for xcodegen
        working-directory: apps/apple
        run: |
          if [ ! -f Config/Device.xcconfig ]; then
            cp Config/Device.xcconfig.example Config/Device.xcconfig
          fi
      - name: install xcodegen
        run: brew install xcodegen
      - name: xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      # A cache miss must never fail the job. Caches are scoped to the merge
      # ref on a pull request, so the first run primes them and a rerun reuses
      # them; `main` primes them for every later pull request.
      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('packages/*/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
      # Caching the intermediates and the package checkouts reuses dependency
      # modules and unchanged object files. The products are not cached, so
      # the guard always inspects a binary linked in this run.
      - name: cache Release build intermediates
        uses: actions/cache@v4
        with:
          path: |
            apps/apple/build/release/Build/Intermediates.noindex
            apps/apple/build/release/SourcePackages
          key: xcode-release-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/apple/project.yml', 'packages/*/Package.resolved') }}
          restore-keys: |
            xcode-release-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
      - name: generate project
        working-directory: apps/apple
        run: xcodegen generate
      - name: release build for the device
        working-directory: apps/apple
        run: |
          xcodebuild -project ReadLater.xcodeproj -scheme ReadLater \
            -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build/release \
            build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=NO
      - name: the debug flag prefix is absent
        working-directory: apps/apple
        run: |
          BIN="build/release/Build/Products/Release-iphoneos/ReadLater.app/ReadLater"
          if [ ! -f "$BIN" ]; then
            echo "::error::release binary not found at $BIN"
            exit 1
          fi
          SLICES=$(lipo -archs "$BIN")
          if [ "$SLICES" != "arm64" ]; then
            echo "::error::expected one arm64 device slice, got: $SLICES"
            exit 1
          fi
          if strings -a "$BIN" | grep -F -e '--debug.'; then
            echo "::error::the Release binary still holds the debug flag prefix"
            exit 1
          fi
          echo "Release device binary ($SLICES) holds no --debug. marker."

