[package]
name = "readlater-tokens"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generate the Calm Editorial design tokens for every platform from one JSON file."

[dependencies]
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
