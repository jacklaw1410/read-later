name: ReadLater
options:
  bundleIdPrefix: com.readlater

configs:
  Debug: debug
  Release: release
  # Phone builds need signing on, and Xcode does not apply a command-line
  # CODE_SIGNING_ALLOWED to a target that sets it. One config is simpler.
  Device: debug

configFiles:
  # The team id is not a secret, but it belongs to one machine's account, so it
  # stays out of the repo. Copy Device.xcconfig.example once.
  Device: Config/Device.xcconfig

  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  ReadLaterCore:
    path: ../../packages/ReadLaterCore
  ReadLaterUI:
    path: ../../packages/ReadLaterUI
  ReadLaterPacks:
    path: ../../packages/ReadLaterPacks
  ReadLaterStore:
    path: ../../packages/ReadLaterStore

targets:
  ReadLater:
    type: application
    supportedDestinations: [iOS, macOS]
    bundleId: app.readlater.reader
    sources:
      - path: Sources
      # `resources:` is not a target key in XcodeGen. A source entry with an
      # explicit resource build phase is what actually copies the files.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ReadLaterCore
      - package: ReadLaterUI
      - package: ReadLaterPacks
      - package: ReadLaterStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen ignores the target `bundleId` when Xcode generates the
        # Info.plist, and falls back to `<prefix>.<target name>`. Set it here so
        # the built app answers to the id the docs and the device plan use.
        PRODUCT_BUNDLE_IDENTIFIER: app.readlater.reader
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      # A `Device` configuration exists for CI-style signed builds, but a
      # custom config name makes local packages compile Release, which drops
      # the DEBUG-gated launch surface. Phone installs use `-configuration
      # Debug` with command-line signing instead, which keeps DEBUG everywhere.
      configs:
        Debug:
          CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
          CODE_SIGNING_ALLOWED[sdk=macosx*]: YES
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
          CODE_SIGNING_REQUIRED[sdk=macosx*]: NO
        Device:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
    postBuildScripts:
      - name: Stamp the git SHA into the bundle
        basedOnDependencyAnalysis: false
        script: |
          set -u
          SHA=$(git -C "$SRCROOT/../.." rev-parse --short HEAD 2>/dev/null || echo unknown)
          # A file, not an Info.plist key. Xcode processes the generated plist
          # after this phase, so a key added here does not survive a clean
          # build. A file in the bundle does, and the signature covers it.
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GitSHA.txt"
          [ -d "${OUT%/*}" ] || exit 0
          printf '%s\n' "$SHA" > "$OUT"
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          [ -f "$PLIST" ] || exit 0
          /usr/libexec/PlistBuddy -c "Delete :GitSHA" "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :GitSHA string $SHA" "$PLIST" >/dev/null 2>&1 || true

  # Unit tests for app-target logic that no package owns (ReaderSession). Hosted
  # by the app so the session runs as it does in the app.
  ReadLaterAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    bundleId: app.readlater.reader.apptests
    sources:
      - path: AppTests
    dependencies:
      - target: ReadLater
      - package: ReadLaterCore
      - package: ReadLaterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.readlater.reader.apptests
        GENERATE_INFOPLIST_FILE: YES
        # The host app binary sits at a different path per platform.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/ReadLater.app/Contents/MacOS/ReadLater"
        TEST_HOST[sdk=iphone*]: "$(BUILT_PRODUCTS_DIR)/ReadLater.app/ReadLater"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_ALLOWED[sdk=macosx*]: YES
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        CODE_SIGNING_REQUIRED[sdk=macosx*]: NO

  # One UI-test bundle for both destinations. The journeys are grouped by
  # user-facing feature; the platform differences live in Support/.
  ReadLaterE2ETests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    bundleId: app.readlater.reader.e2etests
    sources:
      - path: E2ETests
    dependencies:
      - target: ReadLater
      - package: ReadLaterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.readlater.reader.e2etests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReadLater
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_ALLOWED[sdk=macosx*]: YES
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        CODE_SIGNING_REQUIRED[sdk=macosx*]: NO

schemes:
  ReadLater:
    build:
      targets:
        ReadLater: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ReadLaterE2ETests
        - ReadLaterAppTests
