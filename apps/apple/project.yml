name: ReadLater
options:
  bundleIdPrefix: com.readlater
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  ReadLaterCore:
    path: ../../packages/ReadLaterCore
  ReadLaterUI:
    path: ../../packages/ReadLaterUI
  ReadLaterPacks:
    path: ../../packages/ReadLaterPacks

targets:
  ReadLater:
    type: application
    supportedDestinations: [iOS, macOS]
    bundleId: com.readlater.app
    sources:
      - path: Sources
      # `resources:` is not a target key in XcodeGen. A source entry with an
      # explicit resource build phase is what actually copies the files.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ReadLaterCore
      - package: ReadLaterUI
      - package: ReadLaterPacks
    settings:
      CODE_SIGNING_ALLOWED: NO
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
